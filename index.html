<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>English Chévere</title>
    <meta name="theme-color" content="#07070a" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>

    <div id="app">
      <div id="stack">
        <!-- 3 recycled card elements; roles rotate, front never re-rendered while visible -->
        <div class="card" id="cA"></div>
        <div class="card" id="cB"></div>
        <div class="card" id="cC"></div>

        <div id="end">
          <div class="end-mark">✦</div>
          <p>You've seen all the cards</p>
          <button id="btn-restart">Start over</button>
        </div>
      </div>
    </div>

    <div id="vignette"></div>
    <div id="grain"></div>

    <header id="header">
      <div class="logo">
        <span class="logo-en">ENGLISH</span>
        <span class="logo-ch">CHÉVERE</span>
      </div>
    </header>

    <div id="controls">
      <div id="nav-row">
        <div id="nav-back" class="is-disabled">
          <button id="btn-back" type="button" disabled aria-label="Go back">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <span class="back-label">Back</span>
        </div>
        <button id="btn-next" type="button">Swipe to next</button>
      </div>
    </div>

    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
